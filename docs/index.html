<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caro Arena · Battle Royale</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="brand">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="10" cy="10" r="7"/>
          <path d="M10 3v14M3 10h14"/>
        </svg>
        <span class="brand-name">Caro Arena</span>
      </div>
      <div class="header-chip" id="turn-banner">
        <span class="chip-dot" id="turn-dot"></span>
        <span id="turn-text">Ready</span>
      </div>
    </div>

    <div class="header-right">
      <div class="header-actions">
        <button class="btn btn-primary" id="btn-auto">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5V2.5z"/></svg>
          <span id="btn-auto-text">Battle</span>
        </button>
        <button class="btn btn-ghost" id="btn-new">New battle</button>
        <button class="btn btn-ghost" id="btn-reset">Reset all</button>
      </div>
    </div>
  </header>

  <main class="arena-layout">
    <section class="board-pane">
      <div class="board-stage">
        <div id="replay-bar" class="replay-bar" style="display: none;">
          <div class="replay-info">
            <span class="replay-badge">Replay</span>
            <span id="replay-label">Reviewing battle</span>
          </div>
          <div class="replay-controls">
            <button class="btn btn-xs" onclick="stepReplay(-1)">Prev</button>
            <button class="btn btn-xs" onclick="stepReplay(1)">Next</button>
            <button class="btn btn-xs btn-danger" onclick="exitReplayMode()">Exit</button>
          </div>
        </div>

        <!-- Human turn indicator -->
        <div id="human-turn-bar" class="human-turn-bar" style="display: none;">
          <span>🎯 Your turn — click the board to place a stone</span>
        </div>

        <div class="canvas-wrap">
          <canvas id="caro-canvas" width="700" height="700"></canvas>
          <div class="viewport-hud">
            <button class="hud-btn" id="btn-zoom-in" title="Zoom in">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
            </button>
            <button class="hud-btn" id="btn-zoom-out" title="Zoom out">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 8h9"/></svg>
            </button>
            <button class="hud-btn" id="btn-recenter" title="Center">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="4.5"/><path d="M8 1.5v2.5M8 12v2.5M1.5 8h2.5M12 8h2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="player-legend" id="player-legend"></div>

        <footer class="board-footer">
          <div class="board-hints">
            <span>Drag to pan</span><span class="dot">·</span>
            <span>Scroll to zoom</span><span class="dot">·</span>
            <span>5-in-a-row wins</span>
          </div>
          <div class="board-toggles">
            <label><input type="checkbox" id="toggle-numbers" checked><span>Numbers</span></label>
            <label><input type="checkbox" id="toggle-coords"><span>Coords</span></label>
          </div>
        </footer>
      </div>
    </section>

    <aside class="sidebar">
      <!-- Roster Configuration -->
      <section class="panel" id="panel-roster">
        <div class="panel-header">
          <h2 class="panel-title">Roster</h2>
          <span class="panel-badge" id="roster-count">4 players</span>
        </div>
        <div class="roster-config" id="roster-config">
          <label class="roster-toggle" data-model="laya">
            <input type="checkbox" checked>
            <span class="roster-chip" style="--rc: #0891b2">Laya</span>
          </label>
          <label class="roster-toggle" data-model="jev">
            <input type="checkbox" checked>
            <span class="roster-chip" style="--rc: #7c3aed">Jev</span>
          </label>
          <label class="roster-toggle" data-model="von">
            <input type="checkbox" checked>
            <span class="roster-chip" style="--rc: #059669">Von</span>
          </label>
          <label class="roster-toggle" data-model="mojev">
            <input type="checkbox" checked>
            <span class="roster-chip" style="--rc: #e11d48">MoJev</span>
          </label>
          <label class="roster-toggle" data-model="human">
            <input type="checkbox">
            <span class="roster-chip" style="--rc: #d97706">Human</span>
          </label>
        </div>
      </section>

      <!-- Leaderboard -->
      <section class="panel" id="panel-leaderboard">
        <div class="panel-header">
          <h2 class="panel-title">Standings</h2>
          <span class="panel-badge" id="total-battles-badge">0 battles</span>
        </div>
        <table class="leaderboard-table" id="leaderboard-table">
          <thead>
            <tr><th>#</th><th>Model</th><th>Pts</th><th>W</th><th>Avg</th><th>Played</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </section>

      <!-- Current Battle -->
      <section class="panel" id="panel-battle-status">
        <div class="panel-header">
          <h2 class="panel-title">Current battle</h2>
          <span class="panel-badge" id="battle-number-badge">Battle #1</span>
        </div>
        <div class="battle-roster" id="battle-roster"></div>
      </section>

      <!-- Move Stream + Battle History -->
      <section class="panel panel-scroll" id="panel-history">
        <div class="history-tabs">
          <button class="tab-btn active" id="btn-tab-moves">Moves</button>
          <button class="tab-btn" id="btn-tab-battles">History</button>
          <span class="tab-counter" id="history-counter">0 turns</span>
        </div>
        <div class="tab-view active" id="view-moves">
          <ul class="move-list" id="move-list">
            <li class="empty-state">No moves yet.</li>
          </ul>
        </div>
        <div class="tab-view" id="view-battles">
          <div class="battles-scroll">
            <table class="battles-table">
              <thead>
                <tr><th>Battle</th><th>Winner</th><th>Moves</th><th></th></tr>
              </thead>
              <tbody id="battles-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
