<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#ecd9b6"/>
    </radialGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8935c"/>
      <stop offset="100%" stop-color="#8d6837"/>
    </linearGradient>
    <radialGradient id="stone-cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <radialGradient id="stone-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="stone-rose" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <radialGradient id="gold-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Board background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="url(#grid)" stroke-width="2.5" opacity="0.45">
    <line x1="80" y1="128" x2="432" y2="128"/>
    <line x1="80" y1="192" x2="432" y2="192"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="80" y1="384" x2="432" y2="384"/>
    
    <line x1="128" y1="80" x2="128" y2="432"/>
    <line x1="192" y1="80" x2="192" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="320" y1="80" x2="320" y2="432"/>
    <line x1="384" y1="80" x2="384" y2="432"/>
  </g>

  <!-- Winning Golden Strike Laser -->
  <line x1="128" y1="128" x2="384" y2="384" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <line x1="128" y1="128" x2="384" y2="384" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>

  <!-- Halo on winning stones -->
  <circle cx="128" cy="128" r="42" fill="url(#gold-halo)"/>
  <circle cx="192" cy="192" r="42" fill="url(#gold-halo)"/>
  <circle cx="256" cy="256" r="42" fill="url(#gold-halo)"/>
  <circle cx="320" cy="320" r="42" fill="url(#gold-halo)"/>
  <circle cx="384" cy="384" r="42" fill="url(#gold-halo)"/>

  <!-- Stones (Winning diagonal) -->
  <circle cx="128" cy="128" r="26" fill="url(#stone-cyan)" filter="url(#shadow)"/>
  <circle cx="192" cy="192" r="26" fill="url(#stone-cyan)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="26" fill="url(#stone-cyan)" filter="url(#shadow)"/>
  <circle cx="320" cy="320" r="26" fill="url(#stone-cyan)" filter="url(#shadow)"/>
  <circle cx="384" cy="384" r="26" fill="url(#stone-cyan)" filter="url(#shadow)"/>

  <!-- Competing Opponent Stones -->
  <circle cx="192" cy="256" r="26" fill="url(#stone-purple)" filter="url(#shadow)"/>
  <circle cx="256" cy="192" r="26" fill="url(#stone-rose)" filter="url(#shadow)"/>
  <circle cx="320" cy="256" r="26" fill="url(#stone-purple)" filter="url(#shadow)"/>
</svg>
